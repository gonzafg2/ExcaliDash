# PostgreSQL tuning for ExcaliDash container (256MB RAM)
# Applied via docker-compose volume mount

# Memory (container: 256MB)
shared_buffers = 64MB             # 25% of RAM
work_mem = 4MB                    # Per-operation sort/hash memory
maintenance_work_mem = 32MB       # VACUUM, CREATE INDEX
effective_cache_size = 128MB      # Hint to query planner (50% RAM)

# WAL
wal_buffers = 4MB
checkpoint_completion_target = 0.9

# Query planner
random_page_cost = 1.1            # SSD-optimized (default 4.0)

# Connections
listen_addresses = '*'
max_connections = 20              # Small deployment, backend uses connection_limit=10

# Logging
log_min_duration_statement = 1000 # Log queries >1s (slow query log)
log_statement = 'ddl'             # Log DDL statements (CREATE, ALTER, DROP)
