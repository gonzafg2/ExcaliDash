services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: excalidash-backend
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - PORT=8000
      - NODE_ENV=production
      - UPDATE_CHECK_OUTBOUND=false
      - AUTH_MODE=${AUTH_MODE:-local}
      # Keep disabled by default; only enable when a trusted proxy sanitizes forwarded headers.
      - TRUST_PROXY=${TRUST_PROXY:-false}
      # Optional for single-instance deployments:
      # if unset, backend auto-generates and persists one in the volume.
      # Recommended to set explicitly for portability and multi-instance setups.
      - JWT_SECRET=${JWT_SECRET}
      - CSRF_SECRET=${CSRF_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-6767}}
      # # Local OIDC settings for dev compose.
      # - OIDC_PROVIDER_NAME=Keycloak
      # # Browser-facing issuer URL.
      # - OIDC_ISSUER_URL=http://localhost:8080/realms/excalidash/
      # # Backend-only discovery URL on the shared container network.
      # - OIDC_DISCOVERY_URL=http://keycloak:8080/realms/excalidash/
      # - OIDC_CLIENT_ID=excalidash
      # # Local OIDC test secret; align with oidc/keycloak/realm-excalidash.json.
      # - OIDC_ID_TOKEN_SIGNED_RESPONSE_ALG=RS256
      # - OIDC_CLIENT_SECRET=excalidash-dev-secret
      # - OIDC_REDIRECT_URI=http://localhost:6767/api/auth/oidc/callback
      # - OIDC_SCOPES=openid profile email
      # - OIDC_ADMIN_GROUPS=admins
    volumes:
      - backend-data:/app/prisma
      - uploads:/app/uploads
    networks:
      - excalidash-network
    restart: unless-stopped
    mem_limit: 256m
    cpus: "1.0"
    healthcheck:
      # IPv4 loopback avoids IPv6 localhost resolution issues; the
      # x-forwarded-proto header keeps the check working when the backend
      # enforces HTTPS redirects behind the Cloudflare tunnel.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get({hostname:'127.0.0.1',port:8000,path:'/health',headers:{'x-forwarded-proto':'https'}}, (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: excalidash-frontend
    ports:
      - "${FRONTEND_PORT:-6767}:80"
    environment:
      # Backend URL for nginx proxy (host:port format, no protocol)
      # Override for reverse proxy setups (e.g., excalidash-backend.svc.cluster.local:8000)
      - BACKEND_URL=backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - excalidash-network
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.5"
    healthcheck:
      # Use IPv4 loopback explicitly to avoid IPv6 localhost resolution issues.
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:2025.2.1
    container_name: excalidash-cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}
    depends_on:
      - frontend
    networks:
      - excalidash-network
    restart: unless-stopped
    mem_limit: 128m

networks:
  excalidash-network:
    driver: bridge

volumes:
  backend-data:
  uploads:
